<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>HT Labs — Offline</title>
    <style>
      html,body{height:100%;margin:0;background:#050505;color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      body{display:grid;place-items:center;padding:24px;text-align:center}.mark{width:96px;height:96px;border-radius:22px}.name{margin:18px 0 8px;font-size:13px;font-weight:900;letter-spacing:.28em}.copy{max-width:300px;margin:0;color:#a1a1aa;font-size:14px;line-height:1.5}.hint{margin-top:12px;color:#fb923c;font-size:12px;font-weight:700}
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="app-icon.png" alt="" />
      <p class="name">HT LABS</p>
      <p class="copy">The live market feed needs an internet connection.</p>
      <p class="hint">Reconnect, then reopen the app.</p>
    </main>
  </body>
</html>
